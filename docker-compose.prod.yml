# Runs on the EC2 instance. Not used for local development (see docker-compose.yml and README).
#   docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bendike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bendike
    volumes:
      - bendike-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bendike -d bendike']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://bendike:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bendike
      # The image's WORKDIR is /repo, so these must be absolute to land on the mounted volumes below
      # rather than in the container's writable layer, where a redeploy would lose them.
      UPLOADS_DIR: /repo/uploads
      LIBRARY_LOCAL_DIR: /repo/library-files
    volumes:
      - bendike-uploads:/repo/uploads
      - bendike-library:/repo/library-files

  # One-off maintenance against the deployed database: seeds, imports, migrations. Never starts with `up`.
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm tools npm run seed:catalog -w @bendike/api
  tools:
    profiles: ['tools']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://bendike:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bendike

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # The Caddyfile reads {$DOMAIN}; without this the site address resolves to a bare "api." and Caddy refuses
      # to start, since that is not a name it can get a certificate for.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. DOMAIN=bendike.com}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - bendike-caddy-data:/data
      - bendike-caddy-config:/config

volumes:
  bendike-postgres-data:
  bendike-uploads:
  bendike-library:
  bendike-caddy-data:
  bendike-caddy-config:
