name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  preflight:
    name: Check that CI passed and the deploy is configured
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Read the deploy configuration
        id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_REPO_DIR: ${{ vars.EC2_REPO_DIR }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          missing=""
          for name in ROLE_ARN AWS_REGION WEB_BUCKET CLOUDFRONT_DISTRIBUTION_ID EC2_INSTANCE_ID EC2_REPO_DIR; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Not configured yet. Missing:$missing. See .github/specs/continuous-deployment.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Build the web app and publish it to S3 and CloudFront
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the commit CI validated
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build -w @bendike/web

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync apps/web/dist/assets "s3://$WEB_BUCKET/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          # shop/ holds the mirrored product photography, which is not built from the
          # repo. Without this exclude, --delete wipes it on every deploy.
          aws s3 sync apps/web/dist "s3://$WEB_BUCKET" --delete --exclude "assets/*" --exclude "shop/*" \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" \
            --query 'Invalidation.{Id:Id,Status:Status}' --output table

  api:
    name: Pull and rebuild the API on the EC2 instance
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send the deploy command through SSM Run Command
        id: send
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_REPO_DIR: ${{ vars.EC2_REPO_DIR }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          script=$(cat <<EOF
          set -euo pipefail
          git config --global --add safe.directory "$EC2_REPO_DIR"
          cd "$EC2_REPO_DIR"
          git fetch --quiet origin main
          git checkout --quiet main
          git reset --quiet --hard "$SHA"
          docker compose -f docker-compose.prod.yml up -d --build api
          docker image prune -f > /dev/null
          docker compose -f docker-compose.prod.yml ps
          EOF
          )
          parameters=$(jq -n --arg s "$script" --arg t '1800' '{commands: [$s], executionTimeout: [$t]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Bendike deploy $SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Sent command $command_id"

      - name: Wait for the instance to finish
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Pending|InProgress|Delayed) sleep 10 ;;
              *) echo "Deploy command ended with status $status"; break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json \
            | jq -r '"Status: \(.Status)\n--- stdout ---\n\(.Output)\n--- stderr ---\n\(.Errors)"'
          test "$status" = "Success"

      - name: Check the API answers
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -euo pipefail
          test -n "$API_URL" || { echo "The health check needs the API_URL secret"; exit 1; }
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "${API_URL%/}/api/v1/health"
